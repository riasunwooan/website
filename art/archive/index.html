    <template id="ap-t-0"><div class="apd"><header class="apd-head"><p class="apd-meta">Community service · Designer</p><h2 class="apd-title" id="ap-d-title">Pelican Pocket</h2></header><div class="apd-jump" role="group" aria-label="Sections"><button type="button" data-k="0">The toolkit</button><button type="button" data-k="1">Card guides</button><button type="button" data-k="2">Origami instructions</button></div><div class="apd-body"><p>An illustrated mental health origami toolkit: six cards (support awareness, breathing exercises, a reset manual, progress, coping with failure, and sleep hygiene) that fold into a pocket-sized pelican. Designed as a steady, offline companion that is customizable and always there, it offers grounding strategies, reframing prompts, and reminders of available support.</p><p>Shaped together with student leaders, including prefects, RAs, peer mentors and ISAs, it is officially included in Loomis Chaffee’s Sophomore Seminars and used in Connecticut libraries.</p></div><section class="apd-sec"><div class="apd-sec-head"><h3>The toolkit <span>2</span></h3><a class="apd-dl" href="/assets/art/pelican-pocket/pelican-pocket-toolkit.pdf" target="_blank" rel="noopener">Toolkit PDF ↗</a></div><div class="apc" tabindex="0" aria-roledescription="carousel"><div class="apc-track"><figure class="apc-slide"><img src="/assets/img/art/projects/pelican-main.jpg" alt="The Pelican Pocket and its six cards" loading="lazy"><figcaption>The Pelican Pocket and its six cards</figcaption></figure><figure class="apc-slide"><img src="/assets/img/art/projects/pelican-toolkit.jpg" alt="The printable toolkit sheet" loading="lazy"><figcaption>The printable toolkit sheet</figcaption></figure></div><button class="apc-btn apc-prev" type="button" aria-label="Previous photo">‹</button><button class="apc-btn apc-next" type="button" aria-label="Next photo">›</button><span class="apc-count">1 / 2</span></div></section><section class="apd-sec"><div class="apd-sec-head"><h3>Card guides <span>6</span></h3><a class="apd-dl" href="/assets/art/pelican-pocket/pelican-pocket-card-guides.pdf" target="_blank" rel="noopener">Card guides PDF ↗</a></div><div class="apc" tabindex="0" aria-roledescription="carousel"><div class="apc-track"><figure class="apc-slide"><img src="/assets/img/art/projects/pelican-card-1.jpg" alt="Card 1: Support Awareness" loading="lazy"><figcaption>Card 1: Support Awareness</figcaption></figure><figure class="apc-slide"><img src="/assets/img/art/projects/pelican-card-2.jpg" alt="Card 2: Breathing Exercises" loading="lazy"><figcaption>Card 2: Breathing Exercises</figcaption></figure><figure class="apc-slide"><img src="/assets/img/art/projects/pelican-card-3.jpg" alt="Card 3: Reset Manual" loading="lazy"><figcaption>Card 3: Reset Manual</figcaption></figure><figure class="apc-slide"><img src="/assets/img/art/projects/pelican-card-4.jpg" alt="Card 4: Progress" loading="lazy"><figcaption>Card 4: Progress</figcaption></figure><figure class="apc-slide"><img src="/assets/img/art/projects/pelican-card-5.jpg" alt="Card 5: Coping with Failure" loading="lazy"><figcaption>Card 5: Coping with Failure</figcaption></figure><figure class="apc-slide"><img src="/assets/img/art/projects/pelican-card-6.jpg" alt="Card 6: Sleeping Hygiene" loading="lazy"><figcaption>Card 6: Sleeping Hygiene</figcaption></figure></div><button class="apc-btn apc-prev" type="button" aria-label="Previous photo">‹</button><button class="apc-btn apc-next" type="button" aria-label="Next photo">›</button><span class="apc-count">1 / 6</span></div></section><section class="apd-sec"><div class="apd-sec-head"><h3>Origami instructions <span>5</span></h3><a class="apd-dl" href="/assets/art/pelican-pocket/pelican-pocket-origami-instructions.pdf" target="_blank" rel="noopener">Instructions PDF ↗</a></div><div class="apc" tabindex="0" aria-roledescription="carousel"><div class="apc-track"><figure class="apc-slide"><img src="/assets/img/art/projects/pelican-origami-1.jpg" alt="Steps 0 – 0.999: prepare &amp; cut" loading="lazy"><figcaption>Steps 0 – 0.999: prepare & cut</figcaption></figure><figure class="apc-slide"><img src="/assets/img/art/projects/pelican-origami-2.jpg" alt="Steps 1 – 3" loading="lazy"><figcaption>Steps 1 – 3</figcaption></figure><figure class="apc-slide"><img src="/assets/img/art/projects/pelican-origami-3.jpg" alt="Steps 4 – 5" loading="lazy"><figcaption>Steps 4 – 5</figcaption></figure><figure class="apc-slide"><img src="/assets/img/art/projects/pelican-origami-4.jpg" alt="Steps 6 – 7" loading="lazy"><figcaption>Steps 6 – 7</figcaption></figure><figure class="apc-slide"><img src="/assets/img/art/projects/pelican-origami-5.jpg" alt="Step 8: your Pelican Pocket" loading="lazy"><figcaption>Step 8: your Pelican Pocket</figcaption></figure></div><button class="apc-btn apc-prev" type="button" aria-label="Previous photo">‹</button><button class="apc-btn apc-next" type="button" aria-label="Next photo">›</button><span class="apc-count">1 / 5</span></div></section></div></template>
    <template id="ap-t-1"><div class="apd"><header class="apd-head"><p class="apd-meta">Community service · President</p><h2 class="apd-title" id="ap-d-title">Unwired</h2></header><div class="apd-body"><p>A global nonprofit bridging intergenerational gaps through communal art. Each week, 10+ students and I visit Kimberly Hall in Connecticut to make art with 20+ elderly residents, and I have expanded Unwired to Korea, Hong Kong, and Thailand.</p><a class="apd-insta" href="https://www.instagram.com/project.unwired/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg><span>Follow @project.unwired on Instagram</span><span aria-hidden="true">↗</span></a></div><section class="apd-sec"><div class="apd-sec-head"><h3>Art sessions <span>4</span></h3></div><div class="apc" tabindex="0" aria-roledescription="carousel"><div class="apc-track"><figure class="apc-slide"><img src="/assets/img/art/projects/unwired-1.jpg" alt="Showing off a finished bracelet" loading="lazy"><figcaption>Showing off a finished bracelet</figcaption></figure><figure class="apc-slide"><img src="/assets/img/art/projects/unwired-4.jpg" alt="Painting autumn trees together" loading="lazy"><figcaption>Painting autumn trees together</figcaption></figure><figure class="apc-slide"><img src="/assets/img/art/projects/unwired-3.jpg" alt="A finished mirror, decorated together" loading="lazy"><figcaption>A finished mirror, decorated together</figcaption></figure><figure class="apc-slide"><img src="/assets/img/art/projects/unwired-2.jpg" alt="Working side by side" loading="lazy"><figcaption>Working side by side</figcaption></figure></div><button class="apc-btn apc-prev" type="button" aria-label="Previous photo">‹</button><button class="apc-btn apc-next" type="button" aria-label="Next photo">›</button><span class="apc-count">1 / 4</span></div></section><section class="apd-sec"><div class="apd-sec-head"><h3>On Instagram</h3><a class="apd-dl" href="https://www.instagram.com/project.unwired/" target="_blank" rel="noopener">@project.unwired ↗</a></div><div class="apd-ptabs" role="group" aria-label="Instagram posts"><button type="button" class="apd-ptab" data-k="0" aria-pressed="true">Recent posts</button><button type="button" class="apd-ptab" data-k="1" aria-pressed="false">Previous album</button><button type="button" class="apd-ptab" data-k="2" aria-pressed="false">Unwired Global: Korea Chapter</button></div><div class="apd-embed" data-k="0"><blockquote class="instagram-media" data-instgrm-captioned data-instgrm-permalink="https://www.instagram.com/p/DeLYIqfDgVe/?utm_source=ig_embed&amp;utm_campaign=loading" data-instgrm-version="14"><a href="https://www.instagram.com/p/DeLYIqfDgVe/" target="_blank" rel="noopener">View “Recent posts” on Instagram</a></blockquote><a class="apd-post-link" href="https://www.instagram.com/p/DeLYIqfDgVe/" target="_blank" rel="noopener">Open on Instagram ↗</a></div><div class="apd-embed" data-k="1" hidden><blockquote class="instagram-media" data-instgrm-captioned data-instgrm-permalink="https://www.instagram.com/p/DYxuRkBDvD6/?utm_source=ig_embed&amp;utm_campaign=loading" data-instgrm-version="14"><a href="https://www.instagram.com/p/DYxuRkBDvD6/" target="_blank" rel="noopener">View “Previous album” on Instagram</a></blockquote><a class="apd-post-link" href="https://www.instagram.com/p/DYxuRkBDvD6/" target="_blank" rel="noopener">Open on Instagram ↗</a></div><div class="apd-embed" data-k="2" hidden><blockquote class="instagram-media" data-instgrm-captioned data-instgrm-permalink="https://www.instagram.com/p/DZxFOplicS-/?utm_source=ig_embed&amp;utm_campaign=loading" data-instgrm-version="14"><a href="https://www.instagram.com/p/DZxFOplicS-/" target="_blank" rel="noopener">View “Unwired Global: Korea Chapter” on Instagram</a></blockquote><a class="apd-post-link" href="https://www.instagram.com/p/DZ     <template id="ap-t-2"><div class="apd"><header class="apd-head"><p class="apd-meta">Head Curator</p><h2 class="apd-title" id="ap-d-title">Mercy Gallery</h2></header><div class="apd-jump" role="group" aria-label="Sections"><button type="button" data-k="0">Interactive pieces</button><button type="button" data-k="1">Workshop I hosted</button></div><div class="apd-body"><p>As Head Curator of the Mercy Gallery at The Loomis Chaffee School, I help bring exhibitions to our community, from interactive pieces that invite visitors to reflect on how they feel to hands-on art workshops.</p></div><section class="apd-sec"><div class="apd-sec-head"><h3>Interactive pieces <span>2</span></h3></div><div class="apc" tabindex="0" aria-roledescription="carousel"><div class="apc-track"><figure class="apc-slide"><img src="/assets/img/art/projects/mercy-1.jpg" alt="“How are you feeling?” check-in: visitors drop a marble into the jar that matches their mood" loading="lazy"><figcaption>“How are you feeling?” check-in: visitors drop a marble into the jar that matches their mood</figcaption></figure><figure class="apc-slide"><img src="/assets/img/art/projects/mercy-2.jpg" alt="“How did this make you feel?” wall of visitor sticky notes" loading="lazy"><figcaption>“How did this make you feel?” wall of visitor sticky notes</figcaption></figure></div><button class="apc-btn apc-prev" type="button" aria-label="Previous photo">‹</button><button class="apc-btn apc-next" type="button" aria-label="Next photo">›</button><span class="apc-count">1 / 2</span></div></section><section class="apd-sec"><div class="apd-sec-head"><h3>Workshop I hosted <span>1</span></h3></div><div class="apc" tabindex="0" aria-roledescription="carousel"><div class="apc-track"><figure class="apc-slide"><img src="/assets/img/art/projects/mercy-workshop.jpg" alt="Painted pouches from the workshop" loading="lazy"><figcaption>Painted pouches from the workshop</figcaption></figure></div></div></section></div></template>
    <template id="ap-t-3"><div class="apd"><header class="apd-head"><p class="apd-meta">Community service · with Hana Foundations</p><h2 class="apd-title" id="ap-d-title">Kite Project</h2></header><div class="apd-body"><p>This project was inspired by the idea of flying kites to send messages to those in the sky, and the fact that, especially in Korea, conversations about mental health and suicide are stigmatized. I wanted this project (the process of making a kite together, writing messages, and lastly, flying it together) to allow conversations to happen more naturally, just like the Pelican Pocket project.</p><p>I collaborated with a group, Hana Foundations, that I met at an exhibition with some of my pieces, to have a class with the kids. Below are some photos :)</p></div><section class="apd-sec"><div class="apd-sec-head"><h3>The class <span>2</span></h3><a class="apd-dl" href="https://drive.google.com/drive/folders/1rrWJZanVAV_DmBmpyitGy47LdaVTjIqM" target="_blank" rel="noopener">More photos (Google Drive) ↗</a></div><div class="apc" tabindex="0" aria-roledescription="carousel"><div class="apc-track"><figure class="apc-slide"><img src="/assets/img/art/projects/kite-1.jpg" alt="Kids with the kites they made" loading="lazy"><figcaption>Kids with the kites they made</figcaption></figure><figure class="apc-slide"><img src="/assets/img/art/projects/kite-2.jpg" alt="Drawing designs before painting the kites" loading="lazy"><figcaption>Drawing designs before painting the kites</figcaption></figure></div><button class="apc-btn apc-prev" type="button" aria-label="Previous photo">‹</button><button class="apc-btn apc-next" type="button" aria-label="Next photo">›</button><span class="apc-count">1 / 2</span></div></section></div></template>
