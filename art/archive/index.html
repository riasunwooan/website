    <template id="ap-t-0"><div class="apd"><header class="apd-head"><p class="apd-meta">Community service · Designer</p><h2 class="apd-title" id="ap-d-title">Pelican Pocket</h2></header><div class="apd-jump" role="group" aria-label="Sections"><button type="button" data-k="0">The toolkit</button><button type="button" data-k="1">Card guides</button><button type="button" data-k="2">Origami instructions</button></div><div class="apd-body"><p>There are emergency kits everywhere for physical injuries, but what about our mental well-being? That question became Pelican Pocket: an illustrated origami toolkit you fold yourself, with six cards tucked inside (asking for help, breathing, resetting, progress, coping with failure, and sleep) that offer grounding strategies, reframing prompts, and reminders of the support around you.</p><p>I developed it through my Independent Study Program in visual arts, working with Jess Matzkin, our director of well-being, and visual arts teacher Melanie Carr, and shaped it with student leaders, including prefects, RAs, peer mentors and ISAs. It is now part of Loomis Chaffee’s Seminar in the Common Good, where every sophomore folds their own pocket and learns the tools inside, and it is used in Connecticut libraries.</p><p>Like our school motto, <em>Ne cede malis</em> (do not yield to adversity), I hope it helps people navigate hard moments, and that it keeps going long after I graduate.</p></div><section class="apd-sec"><div class="apd-sec-head"><h3>The toolkit <span>2</span></h3></div><div class="apc" tabindex="0" aria-roledescription="carousel"><div class="apc-track"><figure class="apc-slide"><img src="/assets/img/art/projects/pelican-main.jpg" alt="The Pelican Pocket and its six cards" loading="lazy"><figcaption>The Pelican Pocket and its six cards</figcaption></figure><figure class="apc-slide"><img src="/assets/img/art/projects/pelican-toolkit.jpg" alt="The printable toolkit sheet" loading="lazy"><figcaption>The printable toolkit sheet</figcaption></figure></div><button class="apc-btn apc-prev" type="button" aria-label="Previous photo">‹</button><button class="apc-btn apc-next" type="button" aria-label="Next photo">›</button><span class="apc-count">1 / 2</span></div></section><section class="apd-sec"><div class="apd-sec-head"><h3>Card guides <span>6</span></h3></div><div class="apc" tabindex="0" aria-roledescription="carousel"><div class="apc-track"><figure class="apc-slide"><img src="/assets/img/art/projects/pelican-card-1.jpg" alt="Card 1: Support Awareness" loading="lazy"><figcaption>Card 1: Support Awareness</figcaption></figure><figure class="apc-slide"><img src="/assets/img/art/projects/pelican-card-2.jpg" alt="Card 2: Breathing Exercises" loading="lazy"><figcaption>Card 2: Breathing Exercises</figcaption></figure><figure class="apc-slide"><img src="/assets/img/art/projects/pelican-card-3.jpg" alt="Card 3: Reset Manual" loading="lazy"><figcaption>Card 3: Reset Manual</figcaption></figure><figure class="apc-slide"><img src="/assets/img/art/projects/pelican-card-4.jpg" alt="Card 4: Progress" loading="lazy"><figcaption>Card 4: Progress</figcaption></figure><figure class="apc-slide"><img src="/assets/img/art/projects/pelican-card-5.jpg" alt="Card 5: Coping with Failure" loading="lazy"><figcaption>Card 5: Coping with Failure</figcaption></figure><figure class="apc-slide"><img src="/assets/img/art/projects/pelican-card-6.jpg" alt="Card 6: Sleeping Hygiene" loading="lazy"><figcaption>Card 6: Sleeping Hygiene</figcaption></figure></div><button class="apc-btn apc-prev" type="button" aria-label="Previous photo">‹</button><button class="apc-btn apc-next" type="button" aria-label="Next photo">›</button><span class="apc-count">1 / 6</span></div></section><section class="apd-sec"><div class="apd-sec-head"><h3>Origami instructions <span>5</span></h3></div><div class="apc" tabindex="0" aria-roledescription="carousel"><div class="apc-track"><figure class="apc-slide"><img src="/assets/img/art/projects/pelican-origami-1.jpg" alt="Steps 0 – 0.999: prepare &amp; cut" loading="lazy"><figcaption>Steps 0 – 0.999: prepare & cut</figcaption></figure><figure class="apc-slide"><img src="/assets/img/art/projects/pelican-origami-2.jpg" alt="Steps 1 – 3" loading="lazy"><figcaption>Steps 1 – 3</figcaption></figure><figure class="apc-slide"><img src="/assets/img/art/projects/pelican-origami-3.jpg" alt="Steps 4 – 5" loading="lazy"><figcaption>Steps 4 – 5</figcaption></figure><figure class="apc-slide"><img src="/assets/img/art/projects/pelican-origami-4.jpg" alt="Steps 6 – 7" loading="lazy"><figcaption>Steps 6 – 7</figcaption></figure><figure class="apc-slide"><img src="/assets/img/art/projects/pelican-origami-5.jpg" alt="Step 8: your Pelican Pocket" loading="lazy"><figcaption>Step 8: your Pelican Pocket</figcaption></figure></div><button class="apc-btn apc-prev" type="button" aria-label="Previous photo">‹</button><button class="apc-btn apc-next" type="button" aria-label="Next photo">›</button><span class="apc-count">1 / 5</span></div></section></div></template>
    <template id="ap-t-1"><div class="apd"><header class="apd-head"><p class="apd-meta">Community service · President</p><h2 class="apd-title" id="ap-d-title">Unwired</h2></header><div class="apd-body"><p>A global nonprofit bridging intergenerational gaps through communal art. Each week, 10+ students and I visit Kimberly Hall in Connecticut to make art with 20+ elderly residents, and I have expanded Unwired to Korea, Hong Kong, and Thailand.</p><a class="apd-insta" href="https://www.instagram.com/project.unwired/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg><span>Follow @project.unwired on Instagram</span><span aria-hidden="true">↗</span></a></div><section class="apd-sec"><div class="apd-sec-head"><h3>Art sessions <span>4</span></h3></div><div class="apc" tabindex="0" aria-roledescription="carousel"><div class="apc-track"><figure class="apc-slide"><img src="/assets/img/art/projects/unwired-1.jpg" alt="Showing off a finished bracelet" loading="lazy"><figcaption>Showing off a finished bracelet</figcaption></figure><figure class="apc-slide"><img src="/assets/img/art/projects/unwired-4.jpg" alt="Painting autumn trees together" loading="lazy"><figcaption>Painting autumn trees together</figcaption></figure><figure class="apc-slide"><img src="/assets/img/art/projects/unwired-3.jpg" alt="A finished mirror, decorated together" loading="lazy"><figcaption>A finished mirror, decorated together</figcaption></figure><figure class="apc-slide"><img src="/assets/img/art/projects/unwired-2.jpg" alt="Working side by side" loading="lazy"><figcaption>Working side by side</figcaption></figure></div><button class="apc-btn apc-prev" type="button" aria-label="Previous photo">‹</button><button class="apc-btn apc-next" type="button" aria-label="Next photo">›</button><span class="apc-count">1 / 4</span></div></section><section class="apd-sec"><div class="apd-sec-head"><h3>On Instagram</h3><a class="apd-dl" href="https://www.instagram.com/project.unwired/" target="_blank" rel="noopener">@project.unwired ↗</a></div><div class="apd-ptabs" role="group" aria-label="Instagram posts"><button type="button" class="apd-ptab" data-k="0" aria-pressed="true">Recent posts</button><button type="button" class="apd-ptab" data-k="1" aria-pressed="false">Previous album</button><button type="button" class="apd-ptab" data-k="2" aria-pressed="false">Unwired Global: Korea Chapter</button></div><div class="apd-embed" data-k="0"><blockquote class="instagram-media" data-instgrm-captioned data-instgrm-permalink="https://www.instagram.com/p/DeLYIqfDgVe/?utm_source=ig_embed&amp;utm_campaign=loading" data-instgrm-version="14"><a href="https://www.instagram.com/p/DeLYIqfDgVe/" target="_blank" rel="noopener">View “Recent posts” on Instagram</a></blockquote><a class="apd-post-link" href="https://www.instagram.com/p/DeLYIqfDgVe/" target="_blank" rel="noopener">Open on Instagram ↗</a></div><div class="apd-embed" data-k="1" hidden><blockquote class="instagram-media" data-instgrm-captioned data-instgrm-permalink="https://www.instagram.com/p/DYxuRkBDvD6/?utm_source=ig_embed&amp;utm_campaign=loading" data-instgrm-version="14"><a href="https://www.instagram.com/p/DYxuRkBDvD6/" target="_blank" rel="noopener">View “Previous album” on Instagram</a></blockquote><a class="apd-post-link" href="https://www.instagram.com/p/DYxuRkBDvD6/" target="_blank" rel="noopener">Open on Instagram ↗</a></div><div class="apd-embed" data-k="2" hidden><blockquote class="instagram-media" data-instgrm-captioned data-instgrm-permalink="https://www.instagram.com/p/DZxFOplicS-/?utm_source=ig_embed&amp;utm_campaign=loading" data-instgrm-version="14"><a href="https://www.instagram.com/p/DZxFOplicS-/" target="_blank" rel="noopener">View “Unwired Global: Korea Chapter” on Instagram</a></blockquote><a class="apd-post-link" href="https://www.instagram.com/p/DZ     <template id="ap-t-2"><div class="apd"><header class="apd-head"><p class="apd-meta">Head Curator</p><h2 class="apd-title" id="ap-d-title">Mercy Gallery</h2></header><div class="apd-jump" role="group" aria-label="Sections"><button type="button" data-k="0">Interactive pieces</button><button type="button" data-k="1">Workshop I hosted</button></div><div class="apd-body"><p>As Head Curator of the Mercy Gallery at The Loomis Chaffee School, I help bring exhibitions to our community, from interactive pieces that invite visitors to reflect on how they feel to hands-on art workshops.</p></div><section class="apd-sec"><div class="apd-sec-head"><h3>Interactive pieces <span>2</span></h3></div><div class="apc" tabindex="0" aria-roledescription="carousel"><div class="apc-track"><figure class="apc-slide"><img src="/assets/img/art/projects/mercy-1.jpg" alt="“How are you feeling?” check-in: visitors drop a marble into the jar that matches their mood" loading="lazy"><figcaption>“How are you feeling?” check-in: visitors drop a marble into the jar that matches their mood</figcaption></figure><figure class="apc-slide"><img src="/assets/img/art/projects/mercy-2.jpg" alt="“How did this make you feel?” wall of visitor sticky notes" loading="lazy"><figcaption>“How did this make you feel?” wall of visitor sticky notes</figcaption></figure></div><button class="apc-btn apc-prev" type="button" aria-label="Previous photo">‹</button><button class="apc-btn apc-next" type="button" aria-label="Next photo">›</button><span class="apc-count">1 / 2</span></div></section><section class="apd-sec"><div class="apd-sec-head"><h3>Workshop I hosted <span>1</span></h3></div><div class="apc" tabindex="0" aria-roledescription="carousel"><div class="apc-track"><figure class="apc-slide"><img src="/assets/img/art/projects/mercy-workshop.jpg" alt="Painted pouches from the workshop" loading="lazy"><figcaption>Painted pouches from the workshop</figcaption></figure></div></div></section></div></template>
    <template id="ap-t-3"><div class="apd"><header class="apd-head"><p class="apd-meta">Community service · with Hana Foundations</p><h2 class="apd-title" id="ap-d-title">Kite Kit: <em>Unfinished Conversations</em></h2></header><div class="apd-jump" role="group" aria-label="Sections"><button type="button" data-k="0">The class</button><button type="button" data-k="1">Initial artwork</button><button type="button" data-k="2">Kite kit: <em>Unfinished Conversations</em></button></div><div class="apd-body"><p>In Korea, people sometimes fly kites to send messages to those in the sky. At the same time, conversations about mental health and suicide are still deeply stigmatized there, and the people left behind often carry words they never got to say. I wanted to give those words somewhere to go.</p><p>The project turns that into something you do with your hands: making a kite together, writing messages on it, and letting it fly. Like Pelican Pocket, the goal is for hard conversations to happen more naturally, through making something rather than being asked to talk.</p><p>I partnered with Hana Foundations, a group I met at an exhibition of my work, to run a class where kids built and decorated their own kites. From there I painted my own bird kite covered in messages, and designed <em>Unfinished Conversations</em>, a kite kit “for words left unsaid,” with a step-by-step message guide, a postcard and everything needed to send a message on the wind.</p></div><section class="apd-sec"><div class="apd-sec-head"><h3>The class <span>2</span></h3></div><div class="apc" tabindex="0" aria-roledescription="carousel"><div class="apc-track"><figure class="apc-slide"><img src="/assets/img/art/projects/kite-1.jpg" alt="Kids with the kites they made" loading="lazy"><figcaption>Kids with the kites they made</figcaption></figure><figure class="apc-slide"><img src="/assets/img/art/projects/kite-2.jpg" alt="Drawing designs before painting the kites" loading="lazy"><figcaption>Drawing designs before painting the kites</figcaption></figure></div><button class="apc-btn apc-prev" type="button" aria-label="Previous photo">‹</button><button class="apc-btn apc-next" type="button" aria-label="Next photo">›</button><span class="apc-count">1 / 2</span></div></section><section class="apd-sec"><div class="apd-sec-head"><h3>Initial artwork <span>2</span></h3></div><div class="apc" tabindex="0" aria-roledescription="carousel"><div class="apc-track"><figure class="apc-slide"><img src="/assets/img/art/projects/kite-art-1.jpg" alt="My bird kite, covered in messages: “I miss you,” “I’m here for you,” “You’re not alone”" loading="lazy"><figcaption>My bird kite, covered in messages: “I miss you,” “I’m here for you,” “You’re not alone”</figcaption></figure><figure class="apc-slide"><img src="/assets/img/art/projects/kite-art-2.jpg" alt="The finished kite, ready to fly" loading="lazy"><figcaption>The finished kite, ready to fly</figcaption></figure></div><button class="apc-btn apc-prev" type="button" aria-label="Previous photo">‹</button><button class="apc-btn apc-next" type="button" aria-label="Next photo">›</button><span class="apc-count">1 / 2</span></div></section><section class="apd-sec"><div class="apd-sec-head"><h3>Kite kit: <em>Unfinished Conversations</em> <span>5</span></h3></div><div class="apc" tabindex="0" aria-roledescription="carousel"><div class="apc-track"><figure class="apc-slide"><img src="/assets/img/art/projects/kite-kit-box.jpg" alt="The kit, wrapped and ready to give" loading="lazy"><figcaption>The kit, wrapped and ready to give</figcaption></figure><figure class="apc-slide"><img src="/assets/img/art/projects/kite-kit-open.jpg" alt="Inside: the message guide and folding steps" loading="lazy"><figcaption>Inside: the message guide and folding steps</figcaption></figure><figure class="apc-slide"><img src="/assets/img/art/projects/kite-kit-postcard-front.jpg" alt="Postcard front: “There are words I never got to say to you. Today, I’ll let the wind carry them home.”" loading="lazy"><figcaption>Postcard front: “There are words I never got to say to you. Today, I’ll let the wind carry them home.”</figcaption></figure><figure class="apc-slide"><img src="/assets/img/art/projects/kite-kit-postcard-back.jpg" alt="Postcard back: the message guide" loading="lazy"><figcaption>Postcard back: the message guide</figcaption></figure><figure class="apc-slide"><img src="/assets/img/art/projects/kite-kit-card.jpg" alt="The message card, “A kite kit for words left unsaid”" loading="lazy"><figcaption>The message card, “A kite kit for words left unsaid”</figcaption></figure></div><button class="apc-btn apc-prev" type="button" aria-label="Previous photo">‹</button><button class="apc-btn apc-next" type="button" aria-label="Next photo">›</button><span class="apc-count">1 / 5</span></div></section></div></template>
