    <template id="ap-t-0"><div class="apd"><div class="apd-media"><figure class="apd-main"><img src="/assets/img/art/projects/pelican-cover.jpg" alt="The finished Pelican Pocket"><figcaption>The finished Pelican Pocket</figcaption></figure><div class="apd-thumbs"><button type="button" class="apd-th on" data-src="/assets/img/art/projects/pelican-cover.jpg" data-cap="The finished Pelican Pocket"><img src="/assets/img/art/projects/pelican-cover-sm.jpg" alt="The finished Pelican Pocket" loading="lazy"></button><button type="button" class="apd-th" data-src="/assets/img/art/projects/pelican-toolkit.jpg" data-cap="The toolkit sheet"><img src="/assets/img/art/projects/pelican-toolkit-sm.jpg" alt="The toolkit sheet" loading="lazy"></button><button type="button" class="apd-th" data-src="/assets/img/art/projects/pelican-card-1.jpg" data-cap="Card guide 1"><img src="/assets/img/art/projects/pelican-card-1-sm.jpg" alt="Card guide 1" loading="lazy"></button><button type="button" class="apd-th" data-src="/assets/img/art/projects/pelican-card-2.jpg" data-cap="Card guide 2"><img src="/assets/img/art/projects/pelican-card-2-sm.jpg" alt="Card guide 2" loading="lazy"></button><button type="button" class="apd-th" data-src="/assets/img/art/projects/pelican-card-3.jpg" data-cap="Card guide 3"><img src="/assets/img/art/projects/pelican-card-3-sm.jpg" alt="Card guide 3" loading="lazy"></button><button type="button" class="apd-th" data-src="/assets/img/art/projects/pelican-card-4.jpg" data-cap="Card guide 4"><img src="/assets/img/art/projects/pelican-card-4-sm.jpg" alt="Card guide 4" loading="lazy"></button><button type="button" class="apd-th" data-src="/assets/img/art/projects/pelican-card-5.jpg" data-cap="Card guide 5"><img src="/assets/img/art/projects/pelican-card-5-sm.jpg" alt="Card guide 5" loading="lazy"></button><button type="button" class="apd-th" data-src="/assets/img/art/projects/pelican-card-6.jpg" data-cap="Card guide 6"><img src="/assets/img/art/projects/pelican-card-6-sm.jpg" alt="Card guide 6" loading="lazy"></button><button type="button" class="apd-th" data-src="/assets/img/art/projects/pelican-origami-1.jpg" data-cap="Origami instructions, page 1"><img src="/assets/img/art/projects/pelican-origami-1-sm.jpg" alt="Origami instructions, page 1" loading="lazy"></button><button type="button" class="apd-th" data-src="/assets/img/art/projects/pelican-origami-2.jpg" data-cap="Origami instructions, page 2"><img src="/assets/img/art/projects/pelican-origami-2-sm.jpg" alt="Origami instructions, page 2" loading="lazy"></button><button type="button" class="apd-th" data-src="/assets/img/art/projects/pelican-origami-3.jpg" data-cap="Origami instructions, page 3"><img src="/assets/img/art/projects/pelican-origami-3-sm.jpg" alt="Origami instructions, page 3" loading="lazy"></button><button type="button" class="apd-th" data-src="/assets/img/art/projects/pelican-origami-4.jpg" data-cap="Origami instructions, page 4"><img src="/assets/img/art/projects/pelican-origami-4-sm.jpg" alt="Origami instructions, page 4" loading="lazy"></button><button type="button" class="apd-th" data-src="/assets/img/art/projects/pelican-origami-5.jpg" data-cap="Origami instructions, page 5"><img src="/assets/img/art/projects/pelican-origami-5-sm.jpg" alt="Origami instructions, page 5" loading="lazy"></button></div></div><div class="apd-text"><p class="apd-meta">Community service · Designer</p><h2 class="apd-title" id="ap-d-title">Pelican Pocket</h2><p>An illustrated mental health origami toolkit: six cards (support awareness, breathing exercises, a reset manual, progress, coping with failure, and sleep hygiene) that fold into a pocket-sized pelican. Designed as a steady, offline companion that is customizable and always there, it offers grounding strategies, reframing prompts, and reminders of available support.</p><p>Shaped together with student leaders, including prefects, RAs, peer mentors and ISAs, it is officially included in Loomis Chaffee’s Sophomore Seminars and used in Connecticut libraries.</p><ul class="apd-links"><li><a href="/assets/art/pelican-pocket/pelican-pocket-toolkit.pdf" target="_blank" rel="noopener">Toolkit (PDF) ↗</a></li><li><a href="/assets/art/pelican-pocket/pelican-pocket-card-guides.pdf" target="_blank" rel="noopener">Card guides (PDF) ↗</a></li><li><a href="/assets/art/pelican-pocket/pelican-pocket-origami-instructions.pdf" target="_blank" rel="noopener">Origami instructions (PDF) ↗</a></li></ul></div></div></template>
    <template id="ap-t-1"><div class="apd"><div class="apd-media"><figure class="apd-main"><img src="/assets/img/art/projects/unwired-4.jpg" alt="Painting autumn trees together"><figcaption>Painting autumn trees together</figcaption></figure><div class="apd-thumbs"><button type="button" class="apd-th on" data-src="/assets/img/art/projects/unwired-4.jpg" data-cap="Painting autumn trees together"><img src="/assets/img/art/projects/unwired-4-sm.jpg" alt="Painting autumn trees together" loading="lazy"></button><button type="button" class="apd-th" data-src="/assets/img/art/projects/unwired-3.jpg" data-cap="A finished mirror, decorated together"><img src="/assets/img/art/projects/unwired-3-sm.jpg" alt="A finished mirror, decorated together" loading="lazy"></button><button type="button" class="apd-th" data-src="/assets/img/art/projects/unwired-2.jpg" data-cap="Working side by side"><img src="/assets/img/art/projects/unwired-2-sm.jpg" alt="Working side by side" loading="lazy"></button><button type="button" class="apd-th" data-src="/assets/img/art/projects/unwired-1.jpg" data-cap="Showing off a finished bracelet"><img src="/assets/img/art/projects/unwired-1-sm.jpg" alt="Showing off a finished bracelet" loading="lazy"></button></div></div><div class="apd-text"><p class="apd-meta">Community service · President</p><h2 class="apd-title" id="ap-d-title">Unwired</h2><p>A global nonprofit bridging intergenerational gaps through communal art. Each week, 10+ students and I visit Kimberly Hall in Connecticut to make art with 20+ elderly residents, and I have expanded Unwired to Korea, Hong Kong, and Thailand.</p><ul class="apd-links"><li><a href="https://www.instagram.com/project.unwired/" target="_blank" rel="noopener">@project.unwired on Instagram ↗</a></li></ul><div class="apd-embed"><iframe src="https://www.instagram.com/project.unwired/embed" title="Unwired on Instagram" loading="lazy" scrolling="no"></iframe></div></div></div></template>
    <template id="ap-t-2"><div class="apd"><div class="apd-media"><figure class="apd-main"><img src="/assets/img/art/projects/mercy-1.jpg" alt="“How are you feeling?” check-in: visitors drop a marble into the jar that matches their mood"><figcaption>“How are you feeling?” check-in: visitors drop a marble into the jar that matches their mood</figcaption></figure><div class="apd-thumbs"><button type="button" class="apd-th on" data-src="/assets/img/art/projects/mercy-1.jpg" data-cap="“How are you feeling?” check-in: visitors drop a marble into the jar that matches their mood"><img src="/assets/img/art/projects/mercy-1-sm.jpg" alt="“How are you feeling?” check-in: visitors drop a marble into the jar that matches their mood" loading="lazy"></button><button type="button" class="apd-th" data-src="/assets/img/art/projects/mercy-2.jpg" data-cap="“How did this make you feel?” wall of visitor sticky notes"><img src="/assets/img/art/projects/mercy-2-sm.jpg" alt="“How did this make you feel?” wall of visitor sticky notes" loading="lazy"></button><button type="button" class="apd-th" data-src="/assets/img/art/projects/mercy-workshop.jpg" data-cap="Painted pouches from a workshop I hosted"><img src="/assets/img/art/projects/mercy-workshop-sm.jpg" alt="Painted pouches from a workshop I hosted" loading="lazy"></button></div></div><div class="apd-text"><p class="apd-meta">Head Curator</p><h2 class="apd-title" id="ap-d-title">Mercy Gallery</h2><p>As Head Curator of the Mercy Gallery at The Loomis Chaffee School, I help bring exhibitions to our community. These photos show two interactive pieces in the gallery: a “How are you feeling?” check-in where visitors drop a marble into the jar that matches their mood, and a wall where visitors leave sticky notes on how a show made them feel. I also host art workshops, like the one where we painted the pouches below.</p></div></div></template>
    <template id="ap-t-3"><div class="apd"><div class="apd-media"><figure class="apd-main"><img src="/assets/img/art/projects/kite-1.jpg" alt="Kids with the kites they made"><figcaption>Kids with the kites they made</figcaption></figure><div class="apd-thumbs"><button type="button" class="apd-th on" data-src="/assets/img/art/projects/kite-1.jpg" data-cap="Kids with the kites they made"><img src="/assets/img/art/projects/kite-1-sm.jpg" alt="Kids with the kites they made" loading="lazy"></button><button type="button" class="apd-th" data-src="/assets/img/art/projects/kite-2.jpg" data-cap="Drawing designs before painting the kites"><img src="/assets/img/art/projects/kite-2-sm.jpg" alt="Drawing designs before painting the kites" loading="lazy"></button></div></div><div class="apd-text"><p class="apd-meta">Community service · with Hana Foundations</p><h2 class="apd-title" id="ap-d-title">Kite Project</h2><p>This project was inspired by the idea of flying kites to send messages to those in the sky, and the fact that, especially in Korea, conversations about mental health and suicide are stigmatized. I wanted this project (the process of making a kite together, writing messages, and lastly, flying it together) to allow conversations to happen more naturally, just like the Pelican Pocket project.</p><p>I collaborated with a group, Hana Foundations, that I met at an exhibition with some of my pieces, to have a class with the kids. Below are some photos :)</p><ul class="apd-links"><li><a href="https://drive.google.com/drive/folders/1rrWJZanVAV_DmBmpyitGy47LdaVTjIqM" target="_blank" rel="noopener">More photos (Google Drive) ↗</a></li></ul></div></div></template>
